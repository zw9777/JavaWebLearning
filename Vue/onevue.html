<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VueTest</title>
</head>
<body>
    <div id="app">
        <h1>{{ message }}</h1>
        <h2>{{ countwz }}</h2>
    </div>
</body>
    <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        const App = {
            data() {
                return {
                    message: 'Hello Vue!',
                    countwz: 999999
                };
            }
        };
        createApp(App).mount('#app');
    </script>
</body>
</html>
